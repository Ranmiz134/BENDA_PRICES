<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מחירון חנות הרצליה</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
    <style>
        :root {
            --bg: #f4f6f9;
            --card: #ffffff;
            --text: #1a1f2c;
            --muted: #64748b;
            --border: #e2e8f0;
            --primary: #0066ff;
            --primary-soft: #e8f1ff;
            --red: #d92d20;
            --red-soft: #fef3f2;
            --green: #067647;
            --green-soft: #ecfdf3;
            --green-border: #abefc6;
            --amber: #b54708;
            --amber-soft: #fffaeb;
            --gray-badge: #475467;
            --gray-badge-bg: #f2f4f7;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 0 0 40px 0;
            color: var(--text);
            line-height: 1.4;
        }
        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #fff;
            padding: 18px 16px 14px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 21px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }
        .header-meta {
            margin-top: 6px;
            font-size: 13px;
            color: #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .header-pill {
            background: rgba(255,255,255,0.12);
            padding: 2px 10px;
            border-radius: 999px;
            font-weight: 500;
        }
        .sticky-controls {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(244, 246, 249, 0.96);
            backdrop-filter: blur(8px);
            padding: 12px 14px 10px;
            border-bottom: 1px solid var(--border);
        }
        .container {
            max-width: 880px;
            margin: 0 auto;
        }
        .search-row {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }
        .search-wrap {
            position: relative;
            flex: 1;
        }
        .search-box {
            width: 100%;
            padding: 13px 14px 13px 40px;
            font-size: 16px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            background: #fff;
            color: var(--text);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-box:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.14);
        }
        .clear-btn {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: #e2e8f0;
            color: #475569;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 15px;
            line-height: 1;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .clear-btn.visible { display: flex; }
        .scan-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 16px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0, 102, 255, 0.25);
            transition: background 0.15s, transform 0.1s;
        }
        .scan-btn:active { transform: scale(0.97); }
        .scan-btn:hover { background: #0052cc; }
        .scan-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

        .filters-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 10px 0 2px;
            scrollbar-width: none;
        }
        .filters-bar::-webkit-scrollbar { display: none; }
        .filter-chip {
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #334155;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
        }
        .filter-chip.active {
            background: #0f172a;
            color: #fff;
            border-color: #0f172a;
        }
        .filter-chip.active-promo-chip.active {
            background: var(--green);
            border-color: var(--green);
            color: #fff;
        }

        .status-bar {
            max-width: 880px;
            margin: 10px auto 6px;
            padding: 0 16px;
            font-size: 13px;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-list {
            max-width: 880px;
            margin: 0 auto;
            padding: 0 14px;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .product-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        }
        .product-card.is-out {
            opacity: 0.72;
            background: #fafafa;
        }
        .info-col {
            flex: 1;
            min-width: 0;
        }
        .tags-row {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 5px;
        }
        .tag {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .tag-cat { background: var(--gray-badge-bg); color: var(--gray-badge); }
        .tag-out { background: #fee2e2; color: #b91c1c; }
        .tag-low { background: var(--amber-soft); color: var(--amber); border: 1px solid #fedf89; }
        .tag-gift { background: #f5f3ff; color: #6d28d9; border: 1px solid #ddd6fe; }
        .tag-note { background: #eff6ff; color: #1d4ed8; }

        .product-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 5px;
            word-break: break-word;
        }
        .codes-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 12.5px;
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            direction: ltr;
            justify-content: flex-end;
        }
        .code-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 1px 7px;
            border-radius: 5px;
            user-select: all;
        }
        .code-lbl {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            color: #94a3b8;
            font-size: 11px;
            margin-right: 4px;
        }

        .price-col {
            text-align: left;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            min-width: 125px;
        }
        .reg-price-wrap {
            display: flex;
            align-items: baseline;
            gap: 5px;
        }
        .reg-label {
            font-size: 11px;
            color: var(--muted);
        }
        .reg-price {
            font-size: 19px;
            font-weight: 700;
            color: var(--text);
            background: var(--primary-soft);
            color: #0b4db8;
            padding: 4px 10px;
            border-radius: 8px;
        }
        .reg-price.eol {
            background: #f1f5f9;
            color: #64748b;
            font-size: 14px;
        }
        .regular-sale-line {
            font-size: 12px;
            color: #475569;
            font-weight: 500;
        }
        .promo-block {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 3px;
            margin-top: 2px;
        }
        .promo-line {
            font-size: 12.5px;
            color: var(--red);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .promo-price-num {
            font-size: 14.5px;
            font-weight: 800;
            color: var(--red);
        }
        .promo-dates {
            font-size: 11.5px;
            color: var(--red);
            font-weight: 500;
            opacity: 0.92;
        }
        .active-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--green);
            background: var(--green-soft);
            border: 1px solid var(--green-border);
            padding: 2px 8px;
            border-radius: 999px;
            white-space: nowrap;
        }
        .active-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #12b76a;
            display: inline-block;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            display: none;
        }
        .empty-state strong {
            display: block;
            color: var(--text);
            font-size: 17px;
            margin-bottom: 6px;
        }

        /* Scanner Modal */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.82);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-backdrop.open { display: flex; }
        .modal-box {
            background: #fff;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }
        .modal-head h2 {
            margin: 0;
            font-size: 17px;
        }
        .modal-close {
            border: none;
            background: #f1f5f9;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            color: #334155;
        }
        .modal-body {
            padding: 14px;
            text-align: center;
        }
        #reader {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            min-height: 240px;
        }
        .scanner-msg {
            margin-top: 10px;
            font-size: 13px;
            color: var(--muted);
        }
        .scanner-err {
            color: var(--red);
            background: var(--red-soft);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        @media (max-width: 560px) {
            .product-card {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .price-col {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                border-top: 1px dashed var(--border);
                padding-top: 10px;
                width: 100%;
            }
            .promo-block {
                align-items: flex-end;
            }
            .codes-row {
                justify-content: flex-end;
            }
        }
    </style>
</head>

<div class="header">
    <h1>מחירון חנות הרצליה</h1>
    <div class="header-meta">

</div>

<div class="sticky-controls">
    <div class="container">
        <div class="search-row">
            <div class="search-wrap">

                    <line x1="17" y1="8" x2="17" y2="16"/>
                </svg>
                <span>סרוק</span>
            </button>
        </div>
        <div class="filters-bar" id="filtersBar"></div>
    </div>
</div>

<div class="status-bar">
    <span id="resultsCount"></span>
    <span>עדכון מחירון: 20/11/2026</span>
</div>

<ul class="product-list" id="productList"></ul>
<div class="empty-state" id="emptyState">
    <strong>לא נמצאו מוצרים תואמים</strong>
    <span>נסה לחפש מילה אחרת, מק"ט או לסרוק ברקוד מחדש.</span>
</div>

<!-- Barcode Scanner Modal -->
<div class="modal-backdrop" id="scannerModal" role="dialog" aria-modal="true" aria-labelledby="scannerTitle">
    <div class="modal-box">
        <div class="modal-head">
            <h2 id="scannerTitle">סריקת ברקוד</h2>
            <button type="button" class="modal-close" id="closeModalBtn" aria-label="סגור">✕</button>
        </div>
        <div class="modal-body">
            <div id="reader"></div>
            <div class="scanner-msg" id="scannerMsg">כוון את המצלמה אל הברקוד שעל גבי האריזה...</div>
            <div class="scanner-err" id="scannerErr"></div>
        </div>
    </div>
</div>

// Live local date in YYYY-MM-DD (Israel store device clock)
function getTodayISO() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
}

function getTodayDisplay() {
    const now = new Date();
    const d = String(now.getDate()).padStart(2, '0');
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const y = now.getFullYear();
    return `${d}/${m}/${y}`;
}

const TODAY_ISO = getTodayISO();
document.getElementById('todayDatePill').textContent = `תאריך בדיקה: ${getTodayDisplay()}`;

function isPromoActiveToday(item) {
    if (!item.promo || !item.ranges || !item.ranges.length) return false;
    for (const [start, end] of item.ranges) {
        if (TODAY_ISO >= start && TODAY_ISO <= end) return true;
    }
    return false;
}

// Precompute search index & active flag once on load
const ENRICHED = PRODUCTS.map(p => {
    const active = isPromoActiveToday(p);
    const bcClean = (p.bc || '').replace(/^0+/, '');
    const skuClean = (p.sku || '').replace(/-/g, '').toLowerCase();
    const mpnClean = (p.mpn || '').replace(/-/g, '').toLowerCase();
    const searchBlob = `${p.name} ${p.cat} ${p.src} ${p.bc} ${bcClean} ${p.sku} ${skuClean} ${p.mpn} ${mpnClean} ${p.note}`.toLowerCase();
    return { ...p, active, bcClean, searchBlob };
});

let activeFilter = 'ALL';

function formatILS(num) {
    if (num === null || num === undefined) return '';
    return '₪' + Number(num).toLocaleString('he-IL');
}

function escapeHtml(str) {
    return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function buildFilterChips() {
    const counts = {
        ALL: ENRICHED.length,
        ACTIVE_PROMO: ENRICHED.filter(p => p.active).length,
        'נובמבר סייל': ENRICHED.filter(p => p.src === 'נובמבר סייל').length,
        'TP-LINK': ENRICHED.filter(p => p.src === 'TP-LINK').length,
        'WD': ENRICHED.filter(p => p.src === 'WD').length,
        'SHOKZ': ENRICHED.filter(p => p.src === 'SHOKZ').length
    };
    const chips = [
        { id: 'ALL', label: `הכל (${counts.ALL})` },
        { id: 'ACTIVE_PROMO', label: `✓ מבצע תקף היום (${counts.ACTIVE_PROMO})`, cls: 'active-promo-chip' },
        { id: 'נובמבר סייל', label: `נובמבר סייל (${counts['נובמבר סייל']})` },
        { id: 'TP-LINK', label: `TP-LINK (${counts['TP-LINK']})` },
        { id: 'WD', label: `WD (${counts['WD']})` },
        { id: 'SHOKZ', label: `SHOKZ (${counts['SHOKZ']})` }
    ];
    const bar = document.getElementById('filtersBar');
    bar.innerHTML = '';
    for (const c of chips) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `filter-chip ${c.cls || ''} ${activeFilter === c.id ? 'active' : ''}`;
        btn.textContent = c.label;
        btn.onclick = () => {
            activeFilter = c.id;
            buildFilterChips();
            renderList();
        };
        bar.appendChild(btn);
    }
}

function matchesQuery(item, rawQuery) {
    const q = rawQuery.trim().toLowerCase();
    if (!q) return true;
    // Direct numeric barcode match (handles UPC-A 12-digit vs EAN-13 leading zero)
    const digitsOnly = q.replace(/\s+/g, '');
    if (/^\d{6,}$/.test(digitsOnly)) {
        const noZero = digitsOnly.replace(/^0+/, '');
        if (item.bc && (item.bc === digitsOnly || item.bcClean === noZero || item.bc.includes(digitsOnly) || item.bcClean.includes(noZero))) {
            return true;
        }
    }
    // Multi-word AND search across name, barcode, SKU (with/without dashes), MPN, category
    const tokens = q.split(/\s+/).filter(Boolean);
    return tokens.every(tok => {
        const tokNoDash = tok.replace(/-/g, '');
        return item.searchBlob.includes(tok) || (tokNoDash && item.searchBlob.includes(tokNoDash));
    });
}

function renderList() {
    const input = document.getElementById('searchInput');
    const q = input.value;
    const clearBtn = document.getElementById('clearBtn');
    clearBtn.classList.toggle('visible', q.length > 0);

    const filtered = ENRICHED.filter(item => {
        if (activeFilter === 'ACTIVE_PROMO' && !item.active) return false;
        if (activeFilter !== 'ALL' && activeFilter !== 'ACTIVE_PROMO' && item.src !== activeFilter) return false;
        return matchesQuery(item, q);
    });

    const listEl = document.getElementById('productList');
    const emptyEl = document.getElementById('emptyState');
    const countEl = document.getElementById('resultsCount');

    countEl.textContent = `מציג ${filtered.length} מתוך ${ENRICHED.length} מוצרים`;

    if (filtered.length === 0) {
        listEl.innerHTML = '';
        emptyEl.style.display = 'block';
        return;
    }
    emptyEl.style.display = 'none';

    const frag = document.createDocumentFragment();
    for (const p of filtered) {
        const li = document.createElement('li');
        const isOut = p.stock === 'אזל' || p.stock === 'אין מלאי' || p.stock === 'סוף דגם';
        li.className = 'product-card' + (isOut ? ' is-out' : '');

        // Tags
        let tagsHtml = `<span class="tag tag-cat">${escapeHtml(p.cat)}</span>`;
        if (p.stock === 'אזל' || p.stock === 'אין מלאי' || p.stock === 'סוף דגם') {
            tagsHtml += `<span class="tag tag-out">${escapeHtml(p.stock)}</span>`;
        } else if (p.stock === 'יח בודדות') {
            tagsHtml += `<span class="tag tag-low">יח' בודדות</span>`;
        }
        if (p.note) {
            if (p.note.includes('מתנה')) {
                tagsHtml += `<span class="tag tag-gift">🎁 ${escapeHtml(p.note)}</span>`;
            } else if (p.note.includes('חיסול')) {
                tagsHtml += `<span class="tag tag-low">${escapeHtml(p.note)}</span>`;
            } else {
                tagsHtml += `<span class="tag tag-note">${escapeHtml(p.note)}</span>`;
            }
        }

        // Codes row (barcode prominently first if available)
        let codesHtml = '';
        if (p.bc) {
            codesHtml += `<span class="code-item">${escapeHtml(p.bc)}<span class="code-lbl"> :ברקוד</span></span>`;
        }
        if (p.sku) {
            codesHtml += `<span class="code-item">${escapeHtml(p.sku)}<span class="code-lbl"> :מק"ט</span></span>`;
        }
        if (p.mpn) {
            codesHtml += `<span class="code-item">${escapeHtml(p.mpn)}<span class="code-lbl"> :יצרן</span></span>`;
        }

        // Pricing column
        let priceHtml = '';
        if (p.reg !== null && p.reg !== undefined) {
            priceHtml += `<div class="reg-price-wrap"><span class="reg-label">מקורי</span><span class="reg-price">${formatILS(p.reg)}</span></div>`;
        } else {
            priceHtml += `<div class="reg-price-wrap"><span class="reg-price eol">${escapeHtml(p.stock || 'ללא מחיר')}</span></div>`;
        }

        if (p.regSale !== null && p.regSale !== undefined) {
            priceHtml += `<div class="regular-sale-line">${escapeHtml(p.regSaleLbl)}: ${formatILS(p.regSale)}</div>`;
        }

        if (p.promo !== null && p.promo !== undefined) {
            const activeBadge = p.active
                ? `<span class="active-badge"><span class="active-dot"></span>מבצע תקף היום</span>`
                : '';
            const datesHtml = p.dates ? `<div class="promo-dates">תוקף: ${escapeHtml(p.dates)}</div>` : '';
            priceHtml += `
                <div class="promo-block">
                    <div class="promo-line">
                        ${activeBadge}
                        <span>${escapeHtml(p.promoLbl)}: <span class="promo-price-num">${formatILS(p.promo)}</span></span>
                    </div>
                    ${datesHtml}
                </div>
            `;
        }

        li.innerHTML = `
            <div class="info-col">
                <div class="tags-row">${tagsHtml}</div>
                <div class="product-name">${escapeHtml(p.name)}</div>
                <div class="codes-row">${codesHtml}</div>
            </div>
            <div class="price-col">
                ${priceHtml}
            </div>
        `;
        frag.appendChild(li);
    }

    listEl.innerHTML = '';
    listEl.appendChild(frag);
}

// Search input handlers
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
searchInput.addEventListener('input', renderList);
clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    renderList();
    searchInput.focus();
});

// --- Barcode Camera Scanner ---
let html5QrCode = null;
let scannerRunning = false;

const scannerModal = document.getElementById('scannerModal');
const scannerErr = document.getElementById('scannerErr');
const scannerMsg = document.getElementById('scannerMsg');

function playBeep() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 1200;
        gain.gain.value = 0.12;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, 110);
    } catch (e) {}
}

async function stopScanner() {
    scannerModal.classList.remove('open');
    if (html5QrCode && scannerRunning) {
        try {
            await html5QrCode.stop();
        } catch (e) {}
        scannerRunning = false;
    }
    if (html5QrCode) {
        try { html5QrCode.clear(); } catch (e) {}
    }
}

async function startScanner() {
    scannerErr.style.display = 'none';
    scannerErr.textContent = '';
    scannerMsg.style.display = 'block';
    scannerModal.classList.add('open');

    if (!window.isSecureContext) {
        scannerErr.textContent = 'סריקת מצלמה דורשת חיבור מאובטח (HTTPS). העלה את הדף ל-GitHub Pages ונסה משם.';
        scannerErr.style.display = 'block';
        return;
    }
    if (typeof Html5Qrcode === 'undefined') {
        scannerErr.textContent = 'ספריית הסורק לא נטענה (נדרש חיבור אינטרנט). ניתן להקליד את הברקוד ידנית בשורת החיפוש.';
        scannerErr.style.display = 'block';
        return;
    }

    try {
        html5QrCode = new Html5Qrcode('reader');
        const formats = [
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39
        ];
        await html5QrCode.start(
            { facingMode: 'environment' },
            {
                fps: 12,
                qrbox: { width: 270, height: 130 },
                formatsToSupport: formats,
                experimentalFeatures: { useBarCodeDetectorIfSupported: true }
            },
            async (decodedText) => {
                if (!scannerRunning) return;
                playBeep();
                if (navigator.vibrate) navigator.vibrate(80);
                await stopScanner();
                activeFilter = 'ALL';
                buildFilterChips();
                searchInput.value = decodedText.trim();
                renderList();
            },
            () => {}
        );
        scannerRunning = true;
    } catch (err) {
        scannerErr.textContent = 'לא ניתן להפעיל את המצלמה. ודא שאישרת גישה למצלמה בדפדפן ושאין אפליקציה אחרת שמשתמשת בה.';
        scannerErr.style.display = 'block';
        scannerMsg.style.display = 'none';
    }
}

document.getElementById('scanBtn').addEventListener('click', startScanner);
document.getElementById('closeModalBtn').addEventListener('click', stopScanner);
scannerModal.addEventListener('click', (e) => {
    if (e.target === scannerModal) stopScanner();
});

// Init
buildFilterChips();
renderList();
</script>
</body>
